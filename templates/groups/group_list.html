{% extends "groups/layout.html" %}

{% block head_title %}
    Groups
{% endblock %}
{% block groups_content_frame %}
    max-w-5xl self-start
{% endblock %}
{% block groups_content %}

    <div class="flex flex-col space-y-4 ">
        <c-page-header title="Groups" hide_back_button="true" />

        <!-- Control Row: scope control + primary action -->
        <div class="flex items-center gap-3">
            <c-scope-control :segments="scope_segments" />
            <c-button-nav class="btn btn-primary flex-shrink-0 ml-auto"
                          url="{% url 'borrowd_groups:group-create' %}">
                Create group
            </c-button-nav>
        </div>

        <!-- Groups Card Container -->
        <div id="groups-card-container">
            {% include "groups/group_list_card.html" %}

        </div>
    </div>
{% endblock %}
