{% extends "notifications/messages/layout.html" %}

{% block title %}
    Group needs a moderator - Borrow'd
{% endblock %}

{% block content %}
    <p>
        Hi {{ group_member_name }},
    </p>

    <p>
        {{ group_name }} doesn’t currently have a moderator.
    </p>

    <p>
        Would you like to step in?
    </p>

    <p>
        <a href="{{ group_url }}">Become moderator</a>
    </p>
{% endblock %}
