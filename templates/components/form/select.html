{% comment %}
Select Field Component

Gives an already-rendered Django select widget the same visible fieldset/
legend label treatment as c-form.field and c-form.textarea.

Parameters:
- label: field label text
- errors: optional field errors to display
- slot: the rendered <select> (e.g. {{ field }})
{% endcomment %}

<c-vars errors="" />

<fieldset class="fieldset">
    <legend class="fieldset-legend text-xs font-normal text-base-content/60">
        {{ label }}
    </legend>

    {{ slot }}

    {% if errors %}
        <p class="mt-1 text-error text-xs">
            {{ errors|striptags }}
        </p>
    {% endif %}
</fieldset>
