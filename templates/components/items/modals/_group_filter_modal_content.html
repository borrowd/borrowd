<div class="flex flex-col gap-2">
    <template x-for="group in groups" :key="group.id">
        <button type="button"
                @click="toggleGroup(group.id)"
                :class="isGroupSelected(group.id) ? 'badge badge-neutral font-medium text-sm leading-6 cursor-pointer p-3' : 'badge badge-soft font-medium text-sm leading-6 cursor-pointer p-3'"
                x-text="group.name">
        </button>
    </template>
</div>
