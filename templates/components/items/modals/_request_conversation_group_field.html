{% if request_conversation_group_choices %}
    <div class="mt-4">
        <label for="{{ form_id }}-conversation-group"
               class="block text-sm font-semibold whitespace-normal">
            Choose the group for this request
        </label>
        <select id="{{ form_id }}-conversation-group"
                name="conversation_group"
                form="{{ form_id }}"
                class="select select-bordered mt-2 w-full min-w-0"
                required>
            <option value="" selected disabled>
                Choose a group
            </option>
            {% for group in request_conversation_group_choices %}
                <option value="{{ group.pk }}">
                    {{ group.name }}
                </option>
            {% endfor %}
        </select>
        <p class="mt-2 text-sm">
            The request and its conversation will be filed under this group.
        </p>
    </div>
{% endif %}
