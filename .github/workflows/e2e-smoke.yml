name: E2E smoke (cert)

# A small set of critical journeys against the real cert deployment, covering
# what the ephemeral regression run in ci.yml can't: the media backend, TLS and
# DNS, production worker concurrency, and cert configuration drift.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-smoke-cert
  cancel-in-progress: false

jobs:
  smoke:
    name: E2E smoke tests against cert
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e_tests

    env:
      E2E_MODE: cert
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_BETA_CODE: ${{ secrets.E2E_BETA_CODE }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_BORROWER_EMAIL: ${{ secrets.E2E_BORROWER_EMAIL }}
      E2E_BORROWER_PASSWORD: ${{ secrets.E2E_BORROWER_PASSWORD }}
      E2E_LENDER_EMAIL: ${{ secrets.E2E_LENDER_EMAIL }}
      E2E_LENDER_PASSWORD: ${{ secrets.E2E_LENDER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e_tests/requirements.txt

      - run: pip install -r requirements.txt

      - run: playwright install chromium --with-deps

      - run: pytest -m smoke --tb=short --durations=0

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-smoke
          path: e2e_tests/allure-results/
          retention-days: 7
