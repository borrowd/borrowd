name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint, format, type-check, template-lint
    runs-on: ubuntu-latest

    env:
      # The django-stubs mypy plugin imports the settings module (see
      # mypy.ini), which requires a secret key to be present.
      DJANGO_SECRET_KEY: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs every hook defined in .pre-commit-config.yaml
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Django tests (Postgres 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: borrowd
          POSTGRES_PASSWORD: borrowd
          POSTGRES_DB: borrowd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borrowd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: borrowd.config.ci.django
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      BORROWD_BETA_ENABLED: "False"
      DB_NAME: borrowd
      DB_USER: borrowd
      DB_PASSWORD: borrowd
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Mirrors(mostly) .platform.app.yaml -> hooks.build
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run test:js
      - run: npm run build
      - run: uv run manage.py collectstatic --noinput

      # Mirrors .platform.app.yaml -> hooks.deploy
      - run: uv run manage.py migrate

      # Mirrors .platform.app.yaml -> hooks.post_deploy
      - run: uv run manage.py loaddata items/item_categories

      - run: uv run manage.py test

  e2e:
    name: E2E regression tests (Playwright/Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Not yet a required check: failures are reported but don't fail the run.
    continue-on-error: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: borrowd
          POSTGRES_PASSWORD: borrowd
          POSTGRES_DB: borrowd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borrowd"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The app runs ephemerally inside this job against a freshly migrated and
    # seeded database; see e2e-smoke.yml for the run against the cert deployment.
    env:
      DJANGO_SETTINGS_MODULE: borrowd.config.ci.django
      DJANGO_SECRET_KEY: ci-not-a-real-secret
      BORROWD_BETA_ENABLED: "False"
      DEBUG: "True"
      DB_NAME: borrowd
      DB_USER: borrowd
      DB_PASSWORD: borrowd
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      E2E_MODE: ephemeral
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: uv sync --frozen
      - run: npm ci
      - run: npm run build
      - run: uv run manage.py collectstatic --noinput
      - run: uv run manage.py migrate
      - run: uv run manage.py loaddata items/item_categories
      - run: uv run manage.py seed_e2e_data

      - name: Start the app
        run: |
          nohup uv run manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/accounts/login/; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time" >&2
          cat server.log
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: e2e_tests/requirements.txt

      - run: pip install -r e2e_tests/requirements.txt

      - run: playwright install chromium --with-deps

      - name: Run regression tests
        working-directory: e2e_tests
        run: pytest -m regression --tb=short --durations=0

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: e2e_tests/allure-results/
          retention-days: 1

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-log
          path: server.log
          retention-days: 7

  deploy-report:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [e2e]
    # Pull requests from forks get a read-only token and can't publish.
    if: >-
      always() && needs.e2e.result != 'skipped' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    # Each deploy rewrites gh-pages from the history it checked out, so
    # concurrent deploys must queue rather than race.
    concurrency:
      group: allure-report-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: e2e_tests/allure-results

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: e2e_tests/allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Fix allure-history permissions
        run: sudo chown -R $(id -u):$(id -g) ${{ github.workspace }}/allure-history/ || true

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true

  comment-pr:
    name: Post Allure report link to PR
    runs-on: ubuntu-latest
    needs: [deploy-report]
    if: always() && needs.deploy-report.result != 'skipped' && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Post report link to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## E2E Test Report
            [View Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
